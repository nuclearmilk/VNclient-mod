name: vndb_app
description: A Flutter client for VNDB (Visual Novel Database) replicating the website functionality.
publish_to: 'none'
version: 1.3.10+15

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  flutter_riverpod: ^2.4.0
  go_router: ^13.0.0
  cached_network_image: ^3.3.0
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.2.0
  shared_preferences: ^2.2.0
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  path_provider: ^2.1.1
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/bg/
    - assets/images/lang/
    - assets/images/plat/
    - assets/images/list/
